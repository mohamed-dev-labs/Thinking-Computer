# Thinking Computer uses local configuration and local session storage only.
default_provider = "ollama"
max_steps = 8
# workspace = "/absolute/path/to/allowed/workspace"

[providers.openai]
model = "gpt-4.1-mini"
# api_key = "set OPENAI_API_KEY instead of saving secrets here"

[providers.anthropic]
model = "claude-3-5-haiku-latest"
# api_key = "set ANTHROPIC_API_KEY instead of saving secrets here"

[providers.gemini]
model = "gemini-2.5-flash"
# api_key = "set GEMINI_API_KEY instead of saving secrets here"

[providers.ollama]
model = "llama3.2"
base_url = "http://127.0.0.1:11434"

# The following profiles use the shared OpenAI-compatible tool-calling transport.
# Prefer the listed environment variables for secrets; define base_url explicitly
# when a vendor/account/region requires a custom endpoint.
[providers.openrouter]
model = "openai/gpt-4.1-mini"
# OPENROUTER_API_KEY

[providers.groq]
model = "llama-3.3-70b-versatile"
# GROQ_API_KEY

[providers.xai]
model = "grok-4.5"
# XAI_API_KEY

[providers.mistral]
model = "mistral-large-latest"
# MISTRAL_API_KEY

[providers.nvidia_nim]
model = "meta/llama-3.1-8b-instruct"
# base_url = "https://your-nim-endpoint/v1/chat/completions"
# NVIDIA_API_KEY

[providers.cloudflare_workers_ai]
model = "@cf/meta/llama-3.1-8b-instruct"
# base_url = "https://api.cloudflare.com/client/v4/accounts/ACCOUNT_ID/ai/v1/chat/completions"
# CLOUDFLARE_API_TOKEN

[providers.perplexity]
model = "sonar"
# base_url = "https://api.perplexity.ai/chat/completions"
# PERPLEXITY_API_KEY

[providers.moonshot]
model = "kimi-k2"
# base_url = "https://your-moonshot-openai-compatible-endpoint/v1/chat/completions"
# MOONSHOT_API_KEY

[providers.zai]
model = "glm-4.7"
# base_url = "https://your-zai-openai-compatible-endpoint/v1/chat/completions"
# ZAI_API_KEY

[providers.minimax]
model = "MiniMax-M2.5"
# base_url = "https://your-minimax-openai-compatible-endpoint/v1/chat/completions"
# MINIMAX_API_KEY

[providers.dashscope]
model = "qwen-plus"
# base_url = "https://your-dashscope-openai-compatible-endpoint/v1/chat/completions"
# DASHSCOPE_API_KEY

[providers.baidu_qianfan]
model = "ernie-4.5-8k-preview"
# base_url = "https://your-qianfan-compatible-endpoint/v1/chat/completions"
# QIANFAN_API_KEY

# Any future compatible provider can be defined without recompiling.
[providers.private_gateway]
protocol = "openai_compatible"
model = "your-model-id"
base_url = "https://gateway.example/v1/chat/completions"
# api_key = "set OPENAI_COMPATIBLE_API_KEY instead"

# A bridge treats empty allowlists as denied. Add only sender IDs you control.
[channels.telegram]
allowed_senders = ["your-telegram-user-or-chat-id"]
allowed_recipients = ["your-telegram-user-or-chat-id"]
webhook_secret_env = "TELEGRAM_WEBHOOK_SECRET"
# outbound_token_env = "TELEGRAM_BOT_TOKEN"

[channels.discord]
allowed_senders = ["your-discord-user-id"]
allowed_recipients = ["your-discord-channel-id"]
webhook_secret_env = "DISCORD_APPLICATION_PUBLIC_KEY"
# outbound_token_env = "DISCORD_BOT_TOKEN"

# WhatsApp uses the official Cloud API. Configure both values as environment
# variables; the recipient must be in this explicit allowlist.
[channels.whatsapp]
allowed_senders = ["your-whatsapp-sender-id"]
allowed_recipients = ["15555550123"]
# outbound_token_env = "WHATSAPP_ACCESS_TOKEN"
# outbound_phone_number_id_env = "WHATSAPP_PHONE_NUMBER_ID"
# outbound_api_version = "v25.0"

# A generic HTTPS adapter receives {recipient, text} using Bearer auth.
[channels.generic]
allowed_recipients = ["your-reviewed-recipient-id"]
# outbound_token_env = "GENERIC_CHANNEL_TOKEN"
# outbound_endpoint_env = "GENERIC_CHANNEL_ENDPOINT"

# Signal has no official bot/webhook platform. If you operate a trusted local
# Signal adapter on the VM, normalize its output as {id, sender_id, text}.
[channels.signal]
allowed_senders = ["your-signal-sender-id"]

# Services are not chat-model providers. They become available only when a
# corresponding permission-gated tool or plugin is enabled.
[services.firecrawl]
protocol = "web_extract"
base_url = "https://api.firecrawl.dev"
api_key_env = "FIRECRAWL_API_KEY"

[services.elevenlabs]
protocol = "speech"
base_url = "https://api.elevenlabs.io"
api_key_env = "ELEVENLABS_API_KEY"

[services.fal]
protocol = "image"
base_url = "https://fal.run"
api_key_env = "FAL_KEY"

[services.custom_service]
protocol = "custom_http"
base_url = "https://service.example/api"
