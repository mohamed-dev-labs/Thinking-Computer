name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package Unix release
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf thinking-computer-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release thinking-computer
      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/thinking-computer.exe -DestinationPath thinking-computer-${{ matrix.target }}.zip
      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: thinking-computer-${{ matrix.target }}.${{ matrix.archive }}
