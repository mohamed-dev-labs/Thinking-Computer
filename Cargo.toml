[workspace]
members = [
  "crates/thinking-computer",
  "crates/tc-core",
  "crates/tc-system-bridge",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/OWNER/Thinking-Computer"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.7"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.28"
dirs = "5.0"
ed25519-dalek = "2.1"
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
rustyline = "13.0"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
sysinfo = "0.30"
sha2 = "0.10"
tokio = { version = "1.36", features = ["macros", "rt-multi-thread", "net"] }
toml = "0.8"
uuid = { version = "1.7", features = ["v4", "serde"] }
